<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidates</title>
</head>
<body>

    <h1>Candidate List</h1>

    <a href="/candidates/new">Add New Candidate</a>

    <br><br>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Skills</th>
                <th>Experience</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="candidate : ${candidates}">
                <td th:text="${candidate.id}"></td>
                <td th:text="${candidate.name}"></td>
                <td th:text="${candidate.email}"></td>
                <td th:text="${candidate.phone}"></td>
                <td th:text="${candidate.skills}"></td>
                <td th:text="${candidate.experience}"></td>
                <td th:text="${candidate.status}"></td>

                <td>
                    <a th:href="@{/candidates/delete/{id}(id=${candidate.id})}">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
